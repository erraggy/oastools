# OAS 2.0 polymorphism: the Schema Object's discriminator is a bare string
# naming the property, not the object form introduced in OAS 3.0.
# Adapted from the "Models with Polymorphism Support" example in the OAS 2.0
# specification.
swagger: "2.0"
info:
  title: Discriminator (OAS 2.0 string form)
  version: 1.0.0
paths:
  /pets:
    get:
      summary: Get a pet
      responses:
        "200":
          description: a pet
          schema:
            $ref: '#/definitions/Pet'
definitions:
  Pet:
    type: object
    discriminator: petType
    properties:
      name:
        type: string
      petType:
        type: string
    required:
      - name
      - petType
  Cat:
    description: A representation of a cat
    allOf:
      - $ref: '#/definitions/Pet'
      - type: object
        properties:
          huntingSkill:
            type: string
            description: The measured skill for hunting
            default: lazy
            enum:
              - clueless
              - lazy
              - adventurous
              - aggressive
        required:
          - huntingSkill
  Dog:
    description: A representation of a dog
    allOf:
      - $ref: '#/definitions/Pet'
      - type: object
        properties:
          packSize:
            type: integer
            format: int32
            description: the size of the pack the dog is from
            default: 0
            minimum: 0
        required:
          - packSize
